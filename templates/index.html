<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h2>Log a Trade</h2>

    <form id="tradeForm">
        <div class="form-group">
            <label for="stock_name">Stock Name (Autocomplete from Nifty Cash):</label>
            <input list="stockList" type="text" id="stock_name" name="stock_name" autocomplete="off" required>
            <datalist id="stockList">
                {% for stock in stocks %}
                    <option value="{{ stock }}"></option>
                {% endfor %}
            </datalist>
        </div>

        <div class="form-group">
            <label for="buy_date">Buy Date (mm/dd/yyyy):</label>
            <input type="text" id="buy_date" name="buy_date" placeholder="MM/DD/YYYY" maxlength="10" required>
        </div>

        <div class="form-group">
            <label for="sell_date">Sell Date (mm/dd/yyyy):</label>
            <input type="text" id="sell_date" name="sell_date" placeholder="MM/DD/YYYY" maxlength="10" required>
        </div>

        <div class="form-group">
            <label for="buy_price">Buy Price:</label>
            <input type="number" id="buy_price" name="buy_price" step="any" required>
        </div>

        <div class="form-group">
            <label for="sell_price">Sell Price:</label>
            <input type="number" id="sell_price" name="sell_price" step="any" required>
        </div>

        <div class="form-group">
            <label for="strategy_name">Strategy Name:</label>
            <input type="text" id="strategy_name" name="strategy_name" required>
        </div>

        <button type="submit">Save Trade</button>
    </form>

    <div id="message"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
